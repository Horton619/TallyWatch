name: release-firmware

# Push a version tag (e.g. v1.0.1) to build the firmware and attach the .bin to
# a GitHub Release. The TallyWatch Manager reads the latest release to know
# what firmware is available.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core + libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit NeoPixel" "ArduinoJson"

      - name: Stamp firmware version from the tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/const char\* FW_VERSION = \"[^\"]*\";/const char* FW_VERSION = \"$VER\";/" TallyWatch.ino
          grep 'FW_VERSION =' TallyWatch.ino

      - name: Build embedded setup page
        run: node tools/build-page.js

      - name: Compile firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir build .
          cp build/TallyWatch.ino.bin "TallyWatch-${GITHUB_REF_NAME}.bin"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "TallyWatch-${GITHUB_REF_NAME}.bin" \
            --title "TallyWatch $GITHUB_REF_NAME" \
            --generate-notes
